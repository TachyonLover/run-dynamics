<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Dynamics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="run-card">
            <div class="run-header">
                <div class="run-meta">
                    <span id="run-title">Run Overview</span>
                    <span id="run-date">Date</span>
                </div>
                <button id="toggle-details-btn">More</button>
            </div>

            <div id="map-box">
                <div class="map-placeholder">MAP</div>
                <div class="timeline-bar">
                    <span>0:00</span>
                    <div class="timeline-line"></div>
                </div>
            </div>

            <div id="details-panel" class="hidden">
                <div class="details-grid">
                    <div id="summary-box" class="summary-box"></div>

                    <div class="table-section">
                        <h2>Splits</h2>
                        <table id="splits-table">
                            <thead>
                                <tr>
                                    <th>Lap</th>
                                    <th>Time</th>
                                    <th>Distance</th>
                                    <th>Avg Pace</th>
                                    <th>Avg HR</th>
                                    <th>Avg Cadence</th>
                                    <th>Calories</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
